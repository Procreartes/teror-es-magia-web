<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" role="img" aria-label="Cabildo de Gran Canaria">
  <style>
    .lbl{font-family:'Inter',system-ui,sans-serif;fill:#ffd400;font-weight:700}
    .nm{font-size:18px;letter-spacing:-0.3px}
  </style>
  <!-- Coat of arms emblem -->
  <g transform="translate(28 12)">
    <!-- Cross on top -->
    <rect x="38" y="0" width="4" height="10" fill="#ffd400"/>
    <rect x="34" y="3" width="12" height="4" fill="#ffd400"/>
    <!-- Crown -->
    <path d="M 16 14 q 8 -6 16 0 q 8 -6 16 0 q 8 -6 16 0 v 10 h -48 z" fill="#ffd400"/>
    <rect x="14" y="22" width="52" height="6" fill="#ffd400"/>
    <!-- Shield -->
    <path d="M 12 30 h 56 v 48 q 0 16 -28 22 q -28 -6 -28 -22 z" fill="#ffd400"/>
    <!-- Inner quadrants -->
    <g fill="#003594">
      <!-- castle top-left -->
      <rect x="22" y="40" width="14" height="12"/>
      <rect x="24" y="36" width="3" height="6"/>
      <rect x="29.5" y="34" width="3" height="8"/>
      <rect x="35" y="36" width="3" height="6"/>
      <!-- lion top-right -->
      <path d="M 44 40 q 4 -2 6 0 l 1 6 q -2 3 -7 2 z"/>
      <circle cx="48" cy="42" r="2.5"/>
      <!-- palm with two animals bottom -->
      <rect x="38" y="62" width="2.5" height="14"/>
      <path d="M 34 64 q 6 -8 12 0 q -2 -2 -6 -2 q -4 0 -6 2" fill="#ffd400"/>
      <circle cx="33" cy="74" r="3"/>
      <circle cx="46" cy="74" r="3"/>
    </g>
    <!-- Saltires (X marks) -->
    <g stroke="#003594" stroke-width="2" fill="none">
      <path d="M 17 38 l 4 4 M 21 38 l -4 4"/>
      <path d="M 59 38 l 4 4 M 63 38 l -4 4"/>
      <path d="M 17 58 l 4 4 M 21 58 l -4 4"/>
      <path d="M 59 58 l 4 4 M 63 58 l -4 4"/>
      <path d="M 38 92 l 4 4 M 42 92 l -4 4"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="118" y="60" class="lbl nm">Cabildo de</text>
  <text x="118" y="84" class="lbl nm">Gran Canaria</text>
</svg>
