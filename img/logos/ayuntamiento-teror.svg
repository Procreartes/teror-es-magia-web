<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" role="img" aria-label="Ayuntamiento de Teror">
  <style>
    .lbl{font-family:'Inter',system-ui,sans-serif;fill:#fafafa}
    .sm{font-size:11px;font-weight:400;letter-spacing:0.5px}
    .lg{font-size:42px;font-weight:700;letter-spacing:-1px}
  </style>
  <!-- Shield + crown emblem -->
  <g transform="translate(8 8)">
    <!-- Crown of dots -->
    <g fill="#fafafa">
      <path d="M 20 4 q 6 -6 12 0 v 6 h -12 z"/>
      <circle cx="38" cy="6" r="3"/>
      <circle cx="48" cy="4" r="3.5"/>
      <circle cx="58" cy="6" r="3"/>
      <path d="M 64 4 q 6 -6 12 0 v 6 h -12 z"/>
    </g>
    <rect x="24" y="12" width="48" height="6" fill="#fafafa"/>
    <!-- Shield with T -->
    <path d="M 22 22 h 52 v 50 q 0 18 -26 26 q -26 -8 -26 -26 z" fill="#fafafa"/>
    <!-- T cutout -->
    <rect x="34" y="34" width="28" height="9" fill="#0c0418"/>
    <rect x="44" y="34" width="8" height="46" fill="#0c0418"/>
  </g>
  <!-- Text -->
  <text x="110" y="56" class="lbl sm">Ayuntamiento de</text>
  <text x="110" y="100" class="lbl lg">Teror</text>
</svg>
